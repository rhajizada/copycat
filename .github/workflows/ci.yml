name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: write

jobs:
  env:
    name: Set release flags
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.env.outputs.release }}
    steps:
      - name: Determine release mode
        id: env
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          rustflags: "-D warnings"

      - name: Check formatting
        uses: actions-rust-lang/rustfmt@v1

      - name: Lint
        run: cargo clippy --all-targets --all-features

      - name: Run tests
        if: ${{ !(github.ref == 'refs/heads/main' && github.event_name == 'push') }}
        run: cargo test --all-features

      - name: Install coverage tooling
        if: github.ref == 'refs/heads/main'
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
        shell: bash

      - name: Run coverage
        if: github.ref == 'refs/heads/main'
        run: cargo llvm-cov --workspace --all-features

  build:
    name: Build
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: copycat-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/copycat

  release:
    name: Release
    needs: [env, build]
    if: needs.env.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/artifacts

      - name: Prepare release assets
        run: |
          mkdir dist
          find "${{ github.workspace }}/artifacts" -type f -name "copycat" | while read -r file; do
            parent_dir=$(basename "$(dirname "$file")")
            temp_dir=$(mktemp -d)
            cp "$file" "$temp_dir/copycat"
            chmod +x "$temp_dir/copycat"
            tar -czf "dist/${parent_dir}.tar.gz" -C "$temp_dir" copycat
            rm -rf "$temp_dir"
          done
        shell: bash

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
